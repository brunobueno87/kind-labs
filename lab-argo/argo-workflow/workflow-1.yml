apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cowsay-
  namespace: argo
spec:
  entrypoint: cowsay
  templates:
  - name: cowsay
    container:
      image: rancher/cowsay
      command: ["cowsay"]
      args: ["Losers visualize the penalties of failure, Winners visualize the rewards of success. -Dr.Rob Gilbert"]
