apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-
  namespace: argo
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: A
        template: succeeds
      - name: B
        template: fails
      - name: C-runs-if-either-succeeds
        depends: "A.Succeeded  || B.Succeeded"
        template: echo-message
        arguments:
          parameters: [{name: message, value: "Task C"}]
      - name: D-runs-if-both-succeed
        depends: "A.Succeeded && B.Succeeded"
        template: echo-message
        arguments:
          parameters: [{name: message, value: "Task D"}]
  - name: succeeds
    container:
      image: busybox
      command: [sh, -c, "echo 'I succeeded.'"]
  - name: fails
    container:
      image: busybox
      command: [sh, -c, "echo 'I failed.'; exit 1"]
  - name: echo-message
    inputs:
      parameters:
      - name: message
    container:
      image: busybox
      command: [sh, -c, "echo {{inputs.parameters.message}}"]
