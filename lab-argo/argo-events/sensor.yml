apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: workflow-trigger-sa # OBRIGATÓRIO: deve ser o mesmo nome do seu RoleBinding
  dependencies:
    - name: test-dep
      eventSourceName: webhook
      eventName: my-webhook
  triggers:
    - template:
        name: workflow-trigger
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-workflow-
                namespace: argo
              spec:
                entrypoint: main
                templates:
                  - name: main
                    container:
                      image: alpine
                      command: [sh, -c]
                      args: ["echo 'Evento recebido com sucesso!'"]
